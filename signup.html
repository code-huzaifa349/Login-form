<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./asstes/icon/HTML5 Shield Logo on White.png">
</head>

<body>
    <div class="main-container">
        <div class="signup-form">
            <h1>Sign Up</h1>
            <h2>Contact Information</h2>
            <form action="./signup2.html" method="get">
                <input type="phone" id="phone" placeholder="Enter your phone number" required>
                <select name="country" id="country" required>
                    <option value="">Select your country</option>
                    <option value="us">United States</option>
                    <option value="uk">United Kingdom</option>
                    <option value="ca">Canada</option>
                    <option value="pak">Pakistan</option>
                    <option value="in">India</option>
                    <!-- Add more countries as needed -->
                </select>
                <select name="language" id="language" required>
                    <option value="">Select your language</option>
                    <option value="en">English</option>
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="zh">Chinese</option>
                    <!-- Add more languages as needed -->
                </select>
                <select name="province" id="province" required>
                    <option value="">Select your province</option>
                    <option value="on">Sindh</option>
                    <option value="qc">Punjab</option>
                    <option value="ns">Balochistan</option>
                    <option value="nb">khyber pakhtunkhwa</option>
                    <!-- Add more provinces as needed -->
                </select>
                <select name="city" id="city" required>
                    <option value="">Select your city</option>
                    <option value="toronto">Karachi</option>
                    <option value="Hyderabad">Hyderabad</option>
                    <option value="vancouver">Lahore</option>
                    <option value="montreal">Islamabad</option>
                    <option value="calgary">Peshawar</option>
                    <!-- Add more cities as needed -->
                </select>
                <select name="contact-method" id="contact-method" required>
                    <option value="">Select your contact method</option>
                    <option value="email">Email</option>
                    <option value="phone">Phone</option>
                </select>
                <button type="submit">Next</button>
            </form>

        </div>
    </div>
</body>

</html>
