<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./asstes/icon/HTML5 Shield Logo on White.png">
</head>
<body>
   <form action="./signup3.html" method="get">
     <h1>Sign Up</h1>
    <h2>Work Experience</h2>
    <input type="text" id="current-Job-Title" placeholder="Current Job Title" required>
    <input type="years" id="years-of-experience" placeholder="Years of Experience" required>
    <label for="skills">Employment start Date:</label>
    <input type="date" id="employment-start-date" required>
    <label for="upload-resume">Upload Resume:</label>
    <input type="file" id="upload-resume" name="upload-resume" required>
    <label for="skills">Skills:</label>
    <input type="skills" id="skills" placeholder="Skills" required>
    <button type="submit">Next</button>

</form>
</body>
</html>
